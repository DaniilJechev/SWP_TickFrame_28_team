<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TickFrame</title>
    <link rel="stylesheet" href="/css/styles.css?v=1">
    <link rel="stylesheet" href="/css/drawing-toolbar.css?v=1">
    <link rel="stylesheet" href="/css/drawing-properties.css?v=1">
    <link rel="stylesheet" href="/css/indicators-panel.css?v=1">
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="logo">TickFrame</div>
        <div class="watchlist" id="watchlist"></div>
        <div class="fng-container" id="fng-container"></div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="title" id="marketTitle">Market charts - Bitcoin</div>
          <div class="controls">
            <div class="timeframes" id="timeframes">
              <button data-tf="5m" class="active">5m</button>
              <button data-tf="15m">15m</button>
              <button data-tf="1h">1h</button>
              <button data-tf="4h">4h</button>
              <button data-tf="1d">1d</button>
            </div>
            <button id="themeBtn">Theme</button>
            <button id="indicatorsToggle">Indicators</button>
          </div>
        </header>

        <div class="chart-area">
          <section class="content">
            <div class="indicator-chips" id="indicatorChips"></div>
            <div class="chart-container">
              <div id="chart"></div>
              <div class="chart-loading-overlay" id="chartLoading">
                <div class="chart-loading-spinner"></div>
              </div>
            </div>
            <div class="drawing-toolbar" id="drawingToolbar"></div>
            <div id="indicatorPanes"></div>
          </section>
          <aside class="indicators-panel" id="indicatorsPanel">
            <div class="indicators-panel-header">
              <span>Indicators</span>
              <button class="ind-close-btn" id="indicatorsClose" title="Close panel">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              </button>
            </div>
            <div class="indicators-search-wrap">
              <input id="indicatorsSearch" type="text" placeholder="Search indicators..." />
            </div>
            <div class="indicators-list" id="indicatorsList"></div>
          </aside>
        </div>

        <div class="analysis-stack">
          <div class="pattern-analysis">
            <button class="analyze-btn">ANALYZE PATTERNS</button>
            <div class="candle-limit-row">
              <label class="candle-limit-label">Candles:</label>
              <input class="candle-limit-input" type="number" value="10000" min="100" max="500000" step="100">
            </div>
            <div class="result-text">Click to analyze chart for patterns.</div>
          </div>
        </div>
      </main>
    </div>

    <script src="/lib/charting_library/charting_library.min.js"></script>
    <script src="https://unpkg.com/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.development.js"></script>
    <script src="/js/datafeed.js?v=1"></script>
    <script src="/js/sidebar.js?v=1"></script>
    <script src="/js/charts.js?v=1"></script>
    <script src="/js/drawing-bundle.js?v=1"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="/js/drawing-events.js?v=1"></script>
    <script src="/js/drawing-state.js?v=1"></script>
    <script src="/js/drawing-settings.js?v=1"></script>
    <script src="/js/drawing-controller.js?v=1"></script>
    <script src="/js/drawing-toolbar.js?v=1"></script>
    <script src="/js/drawing-properties.js?v=1"></script>
    <script src="/js/drawing-overlay.js?v=1"></script>
    <script src="/js/indicators-bundle.js?v=1"></script>
    <script src="/js/indicators-registry.js?v=1"></script>
    <script src="/js/indicators-state.js?v=1"></script>
    <script src="/js/indicators-panes.js?v=1"></script>
    <script src="/js/indicators-controller.js?v=1"></script>
    <script src="/js/indicators-panel.js?v=1"></script>
    <script src="/js/indicators-chips.js?v=1"></script>
    <script src="/js/app.js?v=1"></script>
  </body>
</html>
