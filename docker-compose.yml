services:
  # ==========================================
  # 1. MAIN BACKEND (Your original code)
  # ==========================================
  tickframe:
    build: .
    ports:
      - "8080:8000"
    env_file:
      - .env
    volumes:
      # Live-reload mounts — changes to source files are reflected immediately,
      # no rebuild needed for frontend/backend code (only rebuild for new pip deps).
      - ./tickframe/frontend:/app/tickframe/frontend
      - ./tickframe/backend:/app/tickframe/backend
    command: uvicorn tickframe.backend.main:app --host 0.0.0.0 --port 8000 --reload

  # ==========================================
  # 2. MACHINE LEARNING MICROSERVICE
  # ==========================================
  ml-service:
    build: ./ml_service
    container_name: ml_service_container
    ports:
      - "8001:8001"
    volumes:
      - ./ml_service/logs:/code/logs
    restart: always